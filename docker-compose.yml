services:
  bookstore:
    build: ./main_app
    command: gunicorn bookstore.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: bookstore.settings.production
      POSTGRES_HOST: bookstore-db
      REDIS_URL: redis://redis:6379/0
      WAREHOUSE_API_URL: http://warehouse:8001/api
    volumes: [bookstore_static:/app/staticfiles]
    depends_on:
      bookstore-db: {condition: service_healthy}
      redis: {condition: service_healthy}

  bookstore-celery:
    build: ./main_app
    command: celery -A bookstore worker -l info
    env_file: .env
    environment: {DJANGO_SETTINGS_MODULE: bookstore.settings.production, POSTGRES_HOST: bookstore-db, REDIS_URL: redis://redis:6379/0}
    depends_on: [bookstore, redis]

  warehouse:
    build: ./satellite_project
    ports:
      - "8001:8001"
    env_file: .env
    environment: {POSTGRES_HOST: warehouse-db, POSTGRES_DB: warehouse_db, POSTGRES_USER: warehouse_user, POSTGRES_PASSWORD: warehouse_password, REDIS_URL: redis://redis:6379/1, USE_REDIS: "True"}
    volumes: [warehouse_static:/app/staticfiles]
    depends_on:
      warehouse-db: {condition: service_healthy}
      redis: {condition: service_healthy}

  warehouse-celery:
    build: ./satellite_project
    command: celery -A warehouse worker -l info
    env_file: .env
    environment: {POSTGRES_HOST: warehouse-db, POSTGRES_DB: warehouse_db, POSTGRES_USER: warehouse_user, POSTGRES_PASSWORD: warehouse_password, REDIS_URL: redis://redis:6379/1, USE_REDIS: "True", SKIP_MIGRATIONS: "True"}
    depends_on: [warehouse, redis]

  warehouse-beat:
    build: ./satellite_project
    command: celery -A warehouse beat -l info
    env_file: .env
    environment: {POSTGRES_HOST: warehouse-db, POSTGRES_DB: warehouse_db, POSTGRES_USER: warehouse_user, POSTGRES_PASSWORD: warehouse_password, REDIS_URL: redis://redis:6379/1, USE_REDIS: "True", SKIP_MIGRATIONS: "True"}
    depends_on: [warehouse, redis]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - bookstore_static:/static/bookstore:ro
      - warehouse_static:/static/warehouse:ro
    depends_on: [bookstore, warehouse]

  bookstore-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: bookstore_db, POSTGRES_USER: bookstore_user, POSTGRES_PASSWORD: bookstore_password}
    volumes: [bookstore_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bookstore_user -d bookstore_db"], interval: 5s, timeout: 5s, retries: 10}

  warehouse-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: warehouse_db, POSTGRES_USER: warehouse_user, POSTGRES_PASSWORD: warehouse_password}
    volumes: [warehouse_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"], interval: 5s, timeout: 5s, retries: 10}

  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10}

volumes:
  bookstore_data:
  warehouse_data:
  bookstore_static:
  warehouse_static:
